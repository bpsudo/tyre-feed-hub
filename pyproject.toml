[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tyre-feed-hub"
version = "0.1.0"
description = "Imports tyre catalogues from several suppliers into one SQL database and monitors the feeds."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "paramiko>=3.4",
    "pydantic>=2.6,<3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
feedhub = "feedhub.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
