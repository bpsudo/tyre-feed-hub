<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} - Tyre Feed Hub</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="/">Tyre Feed Hub</a>
    <nav>
      {% set page = request.url.path %}
      <a href="/" {% if page == "/" %}class="active"{% endif %}>Tableau de bord</a>
      <a href="/anomalies" {% if page.startswith("/anomalies") %}class="active"{% endif %}>Anomalies</a>
      <a href="/search" {% if page.startswith("/search") %}class="active"{% endif %}>Recherche pneu</a>
      <a href="/nouveau-fournisseur" {% if page.startswith("/nouveau-fournisseur") %}class="active"{% endif %}>Nouveau fournisseur</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
